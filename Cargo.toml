[workspace]
members = [
  "crates/machine-fabric-schema",
  "crates/machine-fabric-core",
  "crates/machine-fabric-protocol",
  "crates/machine-fabric-runtime",
  "crates/machine-fabric-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.32"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
arboard = "3.6"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
hex = "0.4"
interprocess = "2.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
tar = "0.4"
thiserror = "2.0"
tungstenite = "0.28"
uuid = { version = "1.18", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
