name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: runner.os != 'Windows'
        run: |
          sh -n scripts/*.sh
          python3 -m unittest discover -s tests -p 'test_macos*.py'
          python3 -m unittest discover -s tests -p 'test_linux*.py'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += $fileErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
          ./scripts/test-release-windows-architecture.ps1
          ./scripts/test-resolve-windows-binary.ps1
          ./scripts/test-windows-immutable-staging.ps1
      - name: Windows release runtime regression
        run: python -m unittest discover -s tests -p 'test_windows_release_runtime.py'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: aarch64-linux-android
      - name: Configure Android linker
        shell: bash
        run: |
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/aarch64-linux-android24-clang"
          test -x "$linker"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$linker" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$toolchain/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo build --locked --target aarch64-linux-android --bin machine-fabric

  additional-desktop-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build desktop release binaries
        shell: bash
        run: |
          if [[ '${{ matrix.target }}' == *-windows-msvc ]]; then
            export RUSTFLAGS='-C target-feature=+crt-static'
          fi
          cargo build --locked --target '${{ matrix.target }}' --bins
      - name: Package and verify Windows release runtime
        if: endsWith(matrix.target, '-windows-msvc')
        shell: bash
        run: |
          scripts/package-release.sh ci '${{ matrix.target }}' 'target/${{ matrix.target }}/debug' dist
          python scripts/verify-windows-release.py 'dist/machine-fabric-ci-${{ matrix.target }}.zip' --target '${{ matrix.target }}'
