name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare draft release
        run: |
          case "$TAG" in v*) ;; *) exit 2;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release.json; then
            test "$(jq -r .isDraft release.json)" = true
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --generate-notes --title "machine-fabric $TAG"
          fi
  build:
    needs: prepare
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-latest
            target: aarch64-linux-android
            android_linker: aarch64-linux-android24-clang
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Configure Android linker
        if: endsWith(matrix.target, '-linux-android')
        shell: bash
        run: |
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/${{ matrix.android_linker }}"
          test -x "$linker"
          cargo_key=$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          cc_key=$(printf '%s' '${{ matrix.target }}' | tr '-' '_')
          echo "CARGO_TARGET_${cargo_key}_LINKER=$linker" >> "$GITHUB_ENV"
          echo "CC_${cc_key}=$linker" >> "$GITHUB_ENV"
          echo "AR_${cc_key}=$toolchain/llvm-ar" >> "$GITHUB_ENV"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag=$TAG
          case "$tag" in v*) ;; *) echo 'release tag must start with v' >&2; exit 2;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          workspace_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test "$workspace_version" = "${tag#v}" || {
            echo "tag version ${tag#v} does not match workspace $workspace_version" >&2
            exit 2
          }
      - name: Build release binaries
        shell: bash
        run: |
          if [[ '${{ matrix.target }}' == *-linux-android ]]; then
            cargo build --release --locked --target '${{ matrix.target }}' --bin machine-fabric
          else
            cargo build --release --locked --target '${{ matrix.target }}' --bins
          fi
      - name: Package release archive
        shell: bash
        run: >-
          scripts/package-release.sh
          '${{ steps.version.outputs.version }}'
          '${{ matrix.target }}'
          'target/${{ matrix.target }}/release'
          dist
      - name: Upload archive to draft release
        shell: bash
        working-directory: dist
        run: |
          for archive in machine-fabric-*; do
            if command -v sha256sum >/dev/null 2>&1; then
              digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
            else
              digest=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
            fi
            printf '%s  %s\n' "$digest" "$archive" > "$archive.sha256"
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" ./*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Download all platform archives
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'machine-fabric-*' --dir dist
      - name: Verify platform archives and create checksums
        working-directory: dist
        run: |
          version=${TAG#v}
          : > SHA256SUMS
          for suffix in aarch64-apple-darwin.tar.gz aarch64-linux-android.tar.gz x86_64-unknown-linux-musl.tar.gz x86_64-pc-windows-msvc.zip; do
            archive=machine-fabric-$version-$suffix
            test -s "$archive"
            test -s "$archive.sha256"
            cat "$archive.sha256" >> SHA256SUMS
          done
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
